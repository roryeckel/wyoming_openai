# The provider lane: one proxy for the live stack, at the default limits, on its network, for the provider
# HA_LIVE_PROVIDER names in providers/<name>.env. How to run it: tests/README.md, "Home Assistant Live Tests". A key
# comes from HA_LIVE_STT_KEY and HA_LIVE_TTS_KEY, for the side or sides the provider serves. Whatever a provider file
# leaves unset comes from providers/defaults/speaches.env, the fallback for the side a preset doesn't serve: the
# stack's own Speaches. Every request to a paid provider is billed to its key, so the port is published on 127.0.0.1
# only. `docker compose -p ha_live_provider down` removes the proxy, and any key with it, without any variable.
name: ha_live_provider

services:
  proxy_provider:
    image: ${WYOMING_OPENAI_IMAGE:-wyoming_openai:live}
    container_name: ha_live_proxy_provider
    restart: "no"
    labels:
      # Checked by the tests, so a run cannot test another provider than HA_LIVE_PROVIDER names
      ha_live.provider: ${HA_LIVE_PROVIDER:?Set HA_LIVE_PROVIDER to the name of a file in tests/ha_e2e/live/providers}
    ports:
      - "127.0.0.1:10406:10300"
    env_file:
      # The fallback for the side the preset doesn't serve, then the preset
      - providers/defaults/speaches.env
      - providers/${HA_LIVE_PROVIDER:?Set HA_LIVE_PROVIDER to the name of a file in tests/ha_e2e/live/providers}.env
    environment:
      WYOMING_URI: tcp://0.0.0.0:10300
      WYOMING_LOG_LEVEL: INFO
      WYOMING_LANGUAGES: en
      STT_OPENAI_KEY: ${HA_LIVE_STT_KEY:-}
      TTS_OPENAI_KEY: ${HA_LIVE_TTS_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 10300), 2).close()"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

networks:
  default:
    name: ha_live_net
    external: true

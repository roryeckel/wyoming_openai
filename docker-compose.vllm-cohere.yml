services:
  wyoming_openai:
    build: .
    container_name: wyoming_openai
    ports:
      - "10300:10300"
    restart: unless-stopped
    environment:
      WYOMING_URI: tcp://0.0.0.0:10300
      WYOMING_LOG_LEVEL: INFO
      WYOMING_LANGUAGES: en nl
      # STT via vLLM serving Cohere Transcribe
      STT_OPENAI_URL: http://vllm-stt:8000/v1
      STT_MODELS: "Qwen/Qwen3-ASR-0.6B"
      STT_BACKEND: "OPENAI"
      # TTS via Kokoro FastAPI
      TTS_OPENAI_URL: http://kokoro:8880/v1
      TTS_MODELS: "kokoro"
      TTS_BACKEND: "KOKORO_FASTAPI"
      TTS_SPEED: "1.0"
    depends_on:
      vllm-stt:
        condition: service_healthy
      kokoro:
        condition: service_healthy

  vllm-stt:
    image: vllm/vllm-openai:nightly
    container_name: vllm-stt
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      VLLM_LOGGING_LEVEL: INFO
      HF_TOKEN: ${HUGGING_FACE_HUB_TOKEN}
      MAX_JOBS: "4"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        pip install "vllm[audio]" &&
        vllm serve Qwen/Qwen3-ASR-0.6B \
          --host 0.0.0.0 \
          --port 8000 \
          --trust-remote-code \
          --gpu-memory-utilization 0.65 \
          --max-model-len 2048 \
          --dtype float16
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    volumes:
      - huggingface-hub:/root/.cache/huggingface

  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: kokoro
    restart: unless-stopped
    ports:
      - "8880:8880"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8880/v1/test"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  huggingface-hub:

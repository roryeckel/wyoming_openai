[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wyoming_openai"
version = "0.8.0"
description = "OpenAI-Compatible Proxy Middleware for the Wyoming Protocol"
authors = [
    { name = "Rory Eckel" }
]
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = "Apache-2.0"
keywords = ["proxy", "tts", "openai", "home-assistant", "stt", "asr", "wyoming"]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "openai[realtime]==3.22.1",
    # Realtime TTS reads its websocket without a receive-queue limit (max_queue=None), which needs 14.1 or later
    "websockets>=14.1",
    "wyoming==1.10.2",
    "yasbd-lib>=1.0.1,<2.0"
]

[project.urls]
Homepage = "https://github.com/roryeckel/wyoming_openai"
Issues = "https://github.com/roryeckel/wyoming_openai/issues"

[project.optional-dependencies]
dev = [
    "ruff==0.16.9",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-mock==3.16.0",
    "pytest-cov==7.1.0",
    "pytest-timeout==2.4.0",
    "pyright==1.1.414",
    "rapidfuzz==3.14.6",
    "httpx==0.28.1",
    # The HA E2E harness passes proxy=None, which websockets only accepts in 15+.
    "websockets>=15",
]

[tool.pytest.ini_options]
markers = [
    "integration: end-to-end tests that require Docker (opt in with: pytest -m integration; use -m \"integration and not ha_e2e\" for the Speaches-only suite)",
    "smoke: minimal e2e subset used by the containerized CI smoke job (pytest -m 'integration and smoke')",
    "ha_e2e: end-to-end tests that drive a real Home Assistant container against the proxy (opt in with: pytest -m ha_e2e)",
]
addopts = "-m 'not integration'"
pythonpath = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["wyoming_openai", "wyoming_openai.*"]

[tool.pyright]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    ".git",
    ".github",
    ".venv",
    "venv",
    "dist",
    "build",
    "tmp",
    "tests/ha_e2e/custom_components",
]
extraPaths = ["tests"]

[tool.ruff]
# Enable Pyflakes (`F`), isort (`I`), and other recommended rules
lint.select = ["E", "F", "I", "W", "N", "UP", "B", "C4", "T20", "RET"]
lint.ignore = []

line-length = 120
indent-width = 4

# Assume Python 3.12
target-version = "py312"

# Exclude a variety of commonly ignored directories.
exclude = [
    ".git",
    ".github",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pypackages__",
    "dist",
    "build",
]

[tool.ruff.lint.isort]
known-first-party = ["wyoming_openai", "ha_e2e"]
